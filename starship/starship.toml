# Starship config
# https://starship.rs/config/

# Timeout for commands executed by starship (ms)
command_timeout = 1000

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "

[git_status]
ahead = "+"
behind = "-"
diverged = "+-"

[nodejs]
symbol = " "

[rust]
symbol = " "

[golang]
symbol = " "

[python]
symbol = " "
